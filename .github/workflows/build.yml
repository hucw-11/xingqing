name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/

      - name: Prepare local signing tool
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" signing-tools/apksigner.jar

      - name: Upload unsigned APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: xinqing-unsigned-apk
          path: |
            app/build/outputs/apk/debug/app-debug-unsigned.apk
            signing-tools/apksigner.jar
          if-no-files-found: error
